[package]
name = "payload-extract-jni"
version = "0.1.1"
edition = "2024"
rust-version = "1.97.1"

[lib]
crate-type = ["cdylib"]

[dependencies]
payload-extract = { git = "https://github.com/YuKongA/payload_extract_rs", rev = "3ddfb6702fe606a2b2cc255e0957051416c83008", default-features = false }
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = { version = "0.4", default-features = false, features = ["std"] }
anyhow = "1"
memmap2 = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.sha2]
opt-level = 3

[profile.release.package.lz4_flex]
opt-level = 3

[features]
default = ["native-tls"]
native-tls = ["payload-extract/http-native-tls"]
rustls-tls = ["payload-extract/http-rustls"]
